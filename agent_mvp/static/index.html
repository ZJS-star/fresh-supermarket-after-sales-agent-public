<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生鲜售后 · 本地模拟</title>
<style>
[hidden]{display:none!important}:root{font-family:system-ui,-apple-system,sans-serif;color:#173c32;background:#f2f7f4;font-size:16px}*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:14px}h1{font-size:25px}h2{font-size:18px;margin-top:0}.notice{background:#fff0cc;padding:12px;border-radius:12px;line-height:1.6}.card{background:white;border:1px solid #d9e5dd;border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 3px 14px #1232}button,select,input,textarea{font:inherit;padding:11px;border-radius:9px;border:1px solid #abc4b4;max-width:100%}button{background:#12684d;color:white;cursor:pointer;border:0;margin:4px 4px 4px 0}button:disabled{opacity:.5;cursor:wait}button.alt{background:#e1eee7;color:#173c32}input,textarea{width:100%;margin:6px 0}textarea{min-height:110px}label{display:block;margin:8px 0}a{color:#12684d}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.bubble{white-space:pre-wrap;background:#ecf3ee;padding:12px;border-radius:10px;margin:8px 0;overflow-wrap:anywhere}.customer{background:#e9f0ff}.staff_message{background:#fff0cc}#evidence{display:flex;flex-wrap:wrap;gap:8px}#evidence img,#evidence video{max-width:180px;max-height:220px;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}small{color:#647b6c}.status{display:inline-block;padding:6px 12px;border-radius:20px;background:#dceee2}#error{color:#9b1f28;white-space:pre-wrap}details{margin:10px 0}@media(max-width:680px){main{padding:12px}.grid{display:block}header{align-items:start}h1{font-size:21px}.card{padding:14px}}
</style><main><header><h1>🥬 生鲜售后 <small id="role"></small></h1><a href="/staff" id="switch">店员入口</a></header><div class="notice">本地开发模拟 · 无真实资金流转。方案需顾客确认及店员审核，查询库存不代表已安排换货。</div>
<section class="card" id="setup"><h2 id="setupTitle">开启开发案件</h2><div id="new"><select id="cases"></select><button onclick="createRun()">开始</button></div><details><summary>恢复已有案件</summary><label>运行编号<input id="rid" autocomplete="off"></label><label>本角色访问凭据<input id="cap" type="password" autocomplete="off"></label><button onclick="connect()">连接</button></details><small id="staffHint" hidden>店员凭据通过本机 CLI access --role staff 获取；顾客凭据无审核权限。</small></section>
<p id="error" role="alert"></p><div id="workspace" hidden><p><span class="status" id="status"></span> <small id="clock"></small></p><small id="runlabel"></small><div class="grid"><div><section class="card"><h2>沟通记录</h2><div id="conversation"></div><label>消息<textarea id="message" placeholder="描述问题或回答追问"></textarea></label><label id="clockLabel">模拟场景时间（选填，跨日继续）<input id="scenarioTime" type="datetime-local"></label><label id="desiredLabel">当前意愿<select id="desired"><option value="">保持当前</option value="refund">评估退款</option><option value="exchange">换货</option><option value="store_inspection">到店检查</option></select></label><button onclick="send()">发送</button><button class="alt" id="continue" onclick="advance()">继续处理 / 重试</button><label id="uploadLabel">补交材料<select id="mediaKind"><option value="image">商品照片</option><option value="receipt">小票照片</option><option value="video">视频</option></select><input id="file" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime"><button class="alt" onclick="upload()">提交材料</button></label></section><section class="card"><h2>已提交证据</h2><div id="evidence"></div></section></div><div><section class="card"><h2>当前方案</h2><div id="proposal">暂无具体方案</div><div id="consent" hidden><button onclick="agree(true)">同意这项具体方案</button><button class="alt" onclick="agree(false)">不同意，需要修改</button></div><p><small>“希望退款”不等于同意具体金额；修改方案后需重新确认。</small></p></section><section class="card" id="staffPanel" hidden><h2>模拟店员操作</h2><button onclick="action('takeover')">接管沟通</button><button onclick="action('confirm_stock')">核对并确认库存</button><button onclick="action('submit_review')">提交当前方案待审</button><button onclick="action('approve_refund')">模拟批准退款</button><button onclick="action('approve_exchange')">模拟批准换货</button><button onclick="action('confirm_inspection')">确认到店安排</button><button class="alt" onclick="action('cancel')">取消 / 释放额度</button><details><summary>修改方案</summary><label>方案<select id="plan"><option value="store_inspection">到店检查</option><option value="exchange_proposal">换货</option><option value="refund_proposal">退款</option></select></label><label>数量（按原销售单位）<input id="quantity" type="number" min="0" value="0"></label><label>退款金额（整数分）<input id="amount" type="number" min="0" value="0"></label><label>下一步<input id="next" value="请顾客确认修改方案，再由店员审核"></label><button onclick="modify()">保存新版本，重新征求同意</button></details><button class="alt" onclick="downloadTrace()">导出完整轨迹</button></section><details class="card"><summary>工单摘要</summary><pre id="ticket"></pre></details></div></div></div></main>
<script>
const staff=location.pathname==='/dev-staff';let rid='',cap='',state=null;document.getElementById('role').textContent=staff?'店员端':'顾客端';document.getElementById('new').hidden=staff;document.getElementById('staffHint').hidden=!staff;document.getElementById('switch').href=staff?'/dev-console':'/dev-staff';document.getElementById('switch').textContent=staff?'顾客入口':'店员入口';document.getElementById('setupTitle').textContent=staff?'连接案件审核':'开启开发案件';document.getElementById('staffPanel').hidden=!staff;document.getElementById('uploadLabel').hidden=staff;document.getElementById('continue').hidden=staff;document.getElementById('desiredLabel').hidden=staff;document.getElementById('clockLabel').hidden=staff;
const $=id=>document.getElementById(id);const names={ready:'待开始',running:'处理中',awaiting_customer:'等待顾客补充',awaiting_evidence:'等待材料',awaiting_confirmation:'等待具体方案确认',pending_review:'等待店员审核',human_takeover:'人工接管',model_unconfigured:'模型尚未配置',model_error:'模型调用失败，可重试',step_limit:'已暂停：达到单轮步数上限',refunded_simulated:'模拟退款已记录',exchanged_simulated:'模拟换货已记录',inspection_confirmed:'已确认到店安排',closed_manual:'人工已关闭'};
async function api(path,method='GET',body=null){$('error').textContent='';let options={method,headers:{Authorization:'Bearer '+cap}};if(body instanceof FormData)options.body=body;else if(body!==null){options.headers['Content-Type']='application/json';options.body=JSON.stringify(body)}let r=await fetch(path,options);if(!r.ok){let e=await r.json().catch(()=>({detail:r.statusText}));throw Error(typeof e.detail==='string'?e.detail:JSON.stringify(e.detail))}return r.json()}
async function task(fn){document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn()}catch(e){$('error').textContent=e.message}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
fetch('/api/cases').then(r=>r.json()).then(d=>d.dev.forEach(id=>{let o=document.createElement('option');o.value=id;o.textContent=id+(d.smoke.includes(id)?' · smoke':'');$('cases').append(o)}));
function base(){return '/api/runs/'+rid}async function createRun(){await task(async()=>{let r=await api('/api/runs','POST',{case_id:$('cases').value});rid=r.run_id;cap=r.customer_token;sessionStorage.setItem('fresh-customer',JSON.stringify({rid,cap}));render(r.state)})}async function connect(){rid=$('rid').value.trim();cap=$('cap').value.trim();await refresh()}async function refresh(){await task(async()=>render(await api(base()+(staff?'/staff':''))))}
async function advance(){await task(async()=>render(await api(base()+'/advance','POST')))}async function send(){await task(async()=>{if(staff)render(await api(base()+'/staff/messages','POST',{text:$('message').value}));else render(await api(base()+'/messages','POST',{text:$('message').value,desired:$('desired').value||null,current_time:$('scenarioTime').value?$('scenarioTime').value+':00+08:00':null}));$('message').value=''})}async function agree(ok){await task(async()=>render(await api(base()+'/messages','POST',{text:ok?'同意此项具体方案':'不同意，请修改',proposal_id:state.proposal_id,agree:ok})))}async function upload(){await task(async()=>{if(!$('file').files[0])throw Error('请选择文件');let form=new FormData();form.append('file',$('file').files[0]);form.append('kind',$('mediaKind').value);render(await api(base()+'/media','POST',form))})}async function action(action){await task(async()=>{let r=await api(base()+'/staff/actions','POST',{action,proposal_id:state.proposal_id});render(r.state)})}async function modify(){await task(async()=>{let b={...(state.final.ticket||{}),plan:$('plan').value,next_action:$('next').value};delete b.proposal_id;delete b.customer_consent;delete b.stock_confirmed;delete b.purchase_confirmed;delete b.quantity_confirmed;if(!b.issue)throw Error('需先有真实工单摘要');render(await api(base()+'/staff/proposal','POST',{body:b,quantity:Number($('quantity').value),amount_cents:Number($('amount').value)}))})}async function downloadTrace(){await task(async()=>{let r=await fetch(base()+'/trace',{headers:{Authorization:'Bearer '+cap}});if(!r.ok)throw Error('无法导出');let a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download=rid+'-trace.jsonl';a.click()})}
let blobs=[];function render(s){state=s;$('workspace').hidden=false;$('setup').hidden=true;$('status').textContent=(s.handoff?'人工负责 · ':'')+(names[s.status]||s.status);$('clock').textContent=s.current_time;$('runlabel').textContent='运行编号 '+s.run_id;$('conversation').replaceChildren();for(let c of s.conversation){let e=document.createElement('div');e.className='bubble '+c.role;e.textContent=(c.role==='customer'?'顾客：':c.role==='staff_message'?'店员：':'Agent：')+c.text;$('conversation').append(e)}$('ticket').textContent=JSON.stringify(s.final,null,2);$('consent').hidden=staff||!s.proposal_id;let p=s.proposal?.body;if(p){$('proposal').textContent=({refund_proposal:'退款建议',exchange_proposal:'换货建议',store_inspection:'到店检查'}[p.plan]||p.plan)+'；数量 '+(p.quantity>0?p.quantity+' '+(s.final.fields.unit||'原销售单位'):'待核实（检查不预填退款数量）')+'；退款 '+(p.amount_cents/100).toFixed(2)+' 元；到店时间 '+(p.terms.appointment_time||'待协商')+'；下一步 '+p.terms.next_action+'；未决事项 '+p.terms.uncertainties.join('、')+'；确认状态 '+s.proposal.consent+'；'+(s.proposal.staff_stock==='pending'?'店员尚未确认库存/安排':'库存已由店员确认');}else $('proposal').textContent='暂无具体方案';if(s.status==='model_unconfigured')$('error').textContent=s.model_configured?'模型配置现已就绪，可点击继续处理。此状态来自之前未配置时的暂停。':'尚未配置视觉模型，请在本机 .env 填入端点、模型名和密钥，再重试。未发生真实模型调用。';if(s.status==='model_error')$('error').textContent=s.last_error||'模型调用失败，请稍后重试。';blobs.forEach(URL.revokeObjectURL);blobs=[];$('evidence').replaceChildren();for(let m of s.media){fetch(base()+'/media/'+m.media_id,{headers:{Authorization:'Bearer '+cap}}).then(r=>r.blob()).then(blob=>{let u=URL.createObjectURL(blob);blobs.push(u);let e=document.createElement(m.kind==='video'?'video':'img');e.src=u;e.title=m.media_id;e.alt=m.media_id;if(e.tagName==='VIDEO')e.controls=true;$('evidence').append(e)})}}
if(!staff){try{let saved=JSON.parse(sessionStorage.getItem('fresh-customer'));if(saved){rid=saved.rid;cap=saved.cap;refresh()}}catch(e){}}
</script></html>
